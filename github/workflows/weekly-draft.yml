name: Weekly draft
on:
  schedule:
    - cron: "0 8 * * 1"      # every Monday 08:00 UTC
  workflow_dispatch:          # lets you run it by hand
permissions:
  contents: write
  pull-requests: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic pyyaml
      - run: python scripts/draft.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: draft/weekly
          title: "New draft for my review"
          body: "AI-drafted from my brief. I will review, edit, then merge."
