name: Weekly draft

on:
  schedule:
    - cron: "0 8 * * 1"
    workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic pyyaml

      - run: python scripts/draft.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add weekly GRC draft"
          title: "Weekly GRC draft"
          body: "AI-assisted draft for human review before publication."
          branch: "weekly-draft"
