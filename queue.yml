author: "[Sodeeq Ipadeola Olalekan]"
role: "Head of Digital Trust, Policy and Compliance"
topics:
  - title: "UK GDPR Data Protection Impact Assessment Template"
    instruction: >-
      Write a practical DPIA template for a small UK organisation, aligned
      to UK GDPR and ICO guidance, with guidance notes in each section.
    status: drafted
  - title: "Incident Response Policy"
    instruction: >-
      Draft a practical Incident Response Policy for a small organisation.
      Include purpose and scope, definitions, document control, roles and
      responsibilities, reporting and escalation, external support contacts,
      severity classification, triage, containment, investigation, evidence
      preservation, eradication, recovery, personal data breach assessment,
      regulatory notification, communications, post-incident review, lessons
      learned, corrective actions, record retention, testing and policy review.
      Use publicly available guidance from NIST CSF 2.0, NIST SP 800-61 and
      UK NCSC where appropriate. Do not claim certification or compliance.
      Do not invent organisation-specific information. Mark unknown information
      as [[PLACEHOLDER]]. Flag jurisdiction-dependent legal requirements for
      human review. Suggested response targets must require organisational
      approval. Clearly state that this is an AI-assisted draft pending human
      review and that human approval is required before adoption.
    status: todo
  - title: "Acceptable Use Policy"
    instruction: >-
      Write a clear acceptable use policy for staff and volunteers covering
      devices, accounts, email and social media.
    status: todo
  - title: "AI Governance Policy"
    instruction: >-
      Write an AI governance policy for a small organisation, aligned to
      NIST AI RMF, covering approved use, human review and data protection.
    status: todo
  - title: "Information Security Risk Register Template"
    instruction: >-
      Create a risk register template with scoring guidance and 10 example
      risks for a small UK organisation.
    status: todo
